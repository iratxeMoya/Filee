# Build, style check and tests of the projects behind the web app (Filee.Web.slnf: Core, Engines, the CLI, Web and
# their tests) on Linux, the platform the Docker image runs on. The desktop app, its installer and the Windows/macOS
# packages are not built here. The image itself is built and tried by docker.yml.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Fonts for the documents the engine tests render.
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libfreetype6 fonts-noto-core fonts-noto-cjk

      - name: Restore engine downloads
        uses: actions/cache@v5
        with:
          path: build/.cache/portable-downloads
          key: portable-engines-linux-x64-${{ hashFiles('src/Filee.Engines/Infrastructure/engines.json') }}

      # The engines the image has, in the repository's engines/ folder where the tests find them
      # (EngineEnvironment.FindBundled): rhwp and 7-Zip, and FFmpeg at the version pinned in engines.json (the video
      # tests expect that version; Ubuntu's own FFmpeg is older and decodes and encodes differently).
      - name: Engines
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./build/fetch-portable-engines.ps1 -Runtime linux-x64 -Destination engines
          read -r url sha256 < <(jq -r '.platforms."linux-x64".components.ffmpeg | "\(.url) \(.sha256)"' src/Filee.Engines/Infrastructure/engines.json)
          archive="build/.cache/portable-downloads/${sha256}.tar.xz"
          [ -f "$archive" ] || curl -fsSL --retry 3 -o "$archive" "$url"
          echo "${sha256,,}  $archive" | sha256sum --check
          mkdir -p engines/ffmpeg
          tar -xJf "$archive" -C engines/ffmpeg --strip-components=1

      - name: Restore
        run: dotnet restore Filee.Web.slnf

      - name: Check formatting
        run: dotnet format Filee.Web.slnf --verify-no-changes --no-restore --severity warn

      - name: Build
        run: dotnet build Filee.Web.slnf --no-restore -c Release

      - name: Test
        run: dotnet test Filee.Web.slnf --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
